name: Verify build

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]

jobs:
  call-workflow-in-another-repo:
    uses: hotwax/accxui/.github/workflows/common-pull-request.yml@71480c5389515eb43de8fccf09155014c52f82fd
    with:
      config-path: .github/labeler.yml
      app: hotwax/fulfillment
      appDir: fulfillment
      accxuiVersion: 71480c5389515eb43de8fccf09155014c52f82fd
    secrets:
      envPAT: ${{ secrets.envPAT }}